<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Portfolio</title>
  <style>
    :root {
      --bg: #0b1220;
      --card: #111a2e;
      --text: #e8eefc;
      --muted: #b5c0dc;
      --accent: #4f8cff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(160deg, #0b1220, #172645);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .portfolio {
      width: min(900px, 100%);
      background: rgba(17, 26, 46, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
      display: grid;
      grid-template-columns: 320px 1fr;
    }

    .photo {
      margin: 0;
      background: #0b1220;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .photo img {
      width: 100%;
      max-width: 280px;
      border-radius: 14px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      object-fit: cover;
    }

    .content {
      padding: 34px 30px;
      display: grid;
      gap: 16px;
      align-content: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      line-height: 1.1;
    }

    .tagline {
      margin: 0;
      color: var(--muted);
      font-size: 1.05rem;
    }

    .about {
      margin: 0;
      color: #d5def5;
      line-height: 1.6;
      max-width: 52ch;
    }

    .button {
      display: inline-block;
      width: fit-content;
      text-decoration: none;
      color: white;
      background: var(--accent);
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: 700;
    }

    @media (max-width: 760px) {
      .portfolio {
        grid-template-columns: 1fr;
      }

      .content {
        padding: 24px;
      }
    }
  </style>
</head>
<body>
  <main class="portfolio">
    <figure class="photo">
      <img src="https://github.com/user-attachments/assets/f27016ea-2402-4969-a9aa-a1711bc78d07" alt="Profile photo" />
    </figure>

    <section class="content">
      <h1>Hello, I'm Britel</h1>
      <p class="tagline">Welcome to my personal portfolio.</p>
      <p class="about">
        I’m passionate about building impactful digital experiences.
        This portfolio is my space to share my projects, skills, and professional journey.
      </p>
      <a class="button" href="#" aria-label="View my projects">View My Projects</a>
    </section>
  </main>
</body>
</html>
